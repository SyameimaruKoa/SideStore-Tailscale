services:
    sidestore-vpn:
        build:
            context: https://github.com/shiqi917/sidestore-vpn-tailscale.git#main
        image: sidestore-vpn-tailscale:local
        container_name: sidestore-tailscale
        hostname: sidestore
        environment:
            - TS_AUTHKEY=${TS_AUTHKEY:-}
            - TS_HOSTNAME=sidestore
            - TS_STATE_DIR=/var/lib/tailscale
            - TS_TAILSCALED_EXTRA_ARGS=--verbose=-1 --port=41642
            - TS_EXTRA_ARGS=--reset --snat-subnet-routes=false
        volumes:
            - ./tailscale-state:/var/lib/tailscale
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        ports:
            - "41642:41642/udp"
        sysctls:
            - net.ipv6.conf.all.disable_ipv6=0
            - net.ipv6.conf.all.forwarding=1
            - net.ipv4.ip_forward=1
        restart: unless-stopped

networks:
    default:
        enable_ipv6: true
